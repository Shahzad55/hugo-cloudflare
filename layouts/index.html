{{ define "main" }}
  <h1>{{ .Site.Title }}</h1>
  {{ with .Content }}{{ . }}{{ end }}
  {{ with .Site.RegularPages }}
    <section>
      <h2>Pages</h2>
      <ul>
        {{ range . }}
          <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
        {{ end }}
      </ul>
    </section>
  {{ end }}
{{ end }}
